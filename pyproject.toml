[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ottawa-infra-stress"
version = "0.2.0"
description = "Local synthetic demonstration of aggregate Ottawa infrastructure stress risk"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.3.2",
    "pandas==2.3.2",
    "pyarrow==23.0.1",
    "geopandas==1.1.3",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "h3==4.5.0",
    "SQLAlchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "GeoAlchemy2==0.20.0",
    "requests==2.33.0",
    "scikit-learn==1.9.0",
    "lightgbm==4.6.0",
    "joblib==1.5.3",
    "fastapi==0.141.1",
    "uvicorn==0.42.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "types-requests==2.33.0.20260712",
    "pre-commit==4.6.2",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
]

[tool.setuptools]
packages = ["src", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "S", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src", "api"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["data/", "models/", "logs/"]
