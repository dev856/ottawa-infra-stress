name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check frontend and verify the committed build is current
        working-directory: frontend
        run: |
          npm ci
          npm run build
          git diff --exit-code dist/app.js

      - name: Run tests with branch coverage
        run: >-
          python -m pytest -q
          --cov=src --cov=api
          --cov-report=term-missing
          --cov-report=xml

      - name: Run Ruff
        run: python -m ruff check src tests api run_pipeline.py

      - name: Run MyPy
        run: python -m mypy src api run_pipeline.py

      - name: Audit pinned runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict

      - name: Generate and validate dependency licence report
        run: >-
          python -m piplicenses
          --from=mixed
          --format=markdown
          --fail-on=UNKNOWN
          --output-file=dependency-licenses.md

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            coverage.xml
            dependency-licenses.md
